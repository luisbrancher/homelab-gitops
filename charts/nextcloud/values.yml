---
image:
  repository: nextcloud
  tag: 34.0.1
  
# Ajuste de recursos para garantir estabilidade durante a migração
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

nextcloud:
  host: nextcloud.lflab.cc
  existingSecret:
    enabled: true
    secretName: nextcloud-credentials
    usernameKey: username
    passwordKey: password
# Traefik proxy 
  configs:
    proxy.config.php: |-
      <?php
      $CONFIG = array (
        'trusted_proxies' => array('10.42.0.0/16'),
        'overwriteprotocol' => 'https',
      );

# Transição lflab.cc: os dois nomes ativos. Sem a annotation do cert-manager
# (o ingress-shim recusa bloco tls sem secretName); o secret antigo segue
# valendo até expirar. Nome novo usa o wildcard padrão do Traefik.
# Ao final: remover o nome antigo e o primeiro bloco tls.
ingress:
  enabled: true
  tls:
    - secretName: nextcloud-tls
      hosts:
        - nextcloud.homelab.luisbrancher.dev
    - hosts:
        - nextcloud.lflab.cc
  hosts:
    - host: nextcloud.homelab.luisbrancher.dev
      paths:
        - path: /
          pathType: Prefix
    - host: nextcloud.lflab.cc
      paths:
        - path: /
          pathType: Prefix

persistence:
  enabled: true
  existingClaim: nextcloud-pvc

# Sidecar que roda o cron.php a cada 5 min (substitui o modo AJAX)
cronjob:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi

internalDatabase:
  enabled: false

postgresql:
  enabled: false

externalDatabase:
  enabled: true
  type: postgresql
  host: nextcloud-postgresql
  database: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-db-credentials
    usernameKey: username
    passwordKey: password

livenessProbe:
  initialDelaySeconds: 120
  periodSeconds: 30
  failureThreshold: 10

readinessProbe:
  initialDelaySeconds: 120
  periodSeconds: 30
  failureThreshold: 10