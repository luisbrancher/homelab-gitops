---
ingress:
  enabled: true
  # Transição lflab.cc: ver comentário em charts/nextcloud/values.yml
  tls:
    - secretName: jellyfin-tls
      hosts:
        - jellyfin.homelab.luisbrancher.dev
    - hosts:
        - jellyfin.lflab.cc
  hosts:
    - host: jellyfin.homelab.luisbrancher.dev
      paths:
        - path: /
          pathType: Prefix
    - host: jellyfin.lflab.cc
      paths:
        - path: /
          pathType: Prefix

service:
  type: NodePort
  nodePort: 30096

persistence:
  config:
    enabled: true
    existingClaim: jellyfin-config-pvc
  media:
    enabled: true
    existingClaim: jellyfin-media-pvc

securityContext:
  runAsUser: 0
  runAsGroup: 0
